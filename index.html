<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Message Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Message Simulator</h1>
    <p class="subtitle">Automatic delivery demo for local testing</p>

    <div class="settings">
      <label for="receiver">Simulated receiver</label>
      <input id="receiver" type="text" value="Demo receiver" maxlength="40" />

      <label for="receiverNumber">Receiver number</label>
      <input id="receiverNumber" type="tel" placeholder="Example: +91 9052770639" maxlength="20" autocomplete="off" />

      <label for="category">Message category</label>
      <select id="category">
        <option value="all">All</option>
        <option value="quotes">Quotes</option>
        <option value="jokes">Jokes</option>
        <option value="greetings">Greetings</option>
      </select>

      <label for="interval">Automatic interval</label>
      <select id="interval">
        <option value="1">Every 1 second</option>
        <option value="2" selected>Every 2 seconds</option>
        <option value="5">Every 5 seconds</option>
      </select>
    </div>

    <div id="message" class="message">Press "Generate" to get a message ✨</div>

    <div class="actions">
      <button id="generateBtn">Generate</button>
      <button id="copyBtn">Copy</button>
      <button id="smsBtn" class="sms-btn">Open SMS app</button>
      <button id="startBtn" class="start-btn">Start automatic demo</button>
      <button id="stopBtn" class="stop-btn" disabled>Stop</button>
    </div>

    <p id="status" class="status" aria-live="polite">Simulation stopped. No message was sent.</p>

    <section class="log-section" aria-labelledby="logTitle">
      <div class="log-heading">
        <h2 id="logTitle">Simulation log</h2>
        <span id="messageCount">0 messages</span>
      </div>
      <ol id="deliveryLog" class="delivery-log" aria-live="polite"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
